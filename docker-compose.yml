version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sekolah_app
    restart: unless-stopped
    working_dir: /app
    environment:
      - APP_NAME="Sekolah App"
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=sekolah_db
      - DB_USERNAME=sekolah_user
      - DB_PASSWORD=sekolah_password
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=redis_password
      - REDIS_PORT=6379
    volumes:
      - ./:/app
      - ./storage/logs:/app/storage/logs
    networks:
      - sekolah_network
    depends_on:
      - mysql
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: sekolah_nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./:/app
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - sekolah_network
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: sekolah_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sekolah_db
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_PASSWORD: sekolah_password
      MYSQL_USER: sekolah_user
      MYSQL_ALLOW_EMPTY_PASSWORD: "false"
    ports:
      - "3306:3306"
    volumes:
      - sekolah_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - sekolah_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "sekolah_user", "-psekolah_password"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: sekolah_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password
    ports:
      - "6379:6379"
    volumes:
      - sekolah_redis_data:/data
    networks:
      - sekolah_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sekolah_mysql_data:
    driver: local
  sekolah_redis_data:
    driver: local

networks:
  sekolah_network:
    driver: bridge
